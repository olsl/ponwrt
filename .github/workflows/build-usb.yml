name: Build PonWrt USB/WiFi (an7581)

on:
  workflow_dispatch:
    inputs:
      label:
        description: Build label
        required: false
        default: usb-wifi
        type: string

permissions:
  contents: read

concurrency:
  group: build-usbwifi
  cancel-in-progress: false

jobs:
  build:
    name: Build an7581 (USB net + WiFi)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libffi-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-usb-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-usb-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure an7581
        run: |
          ./scripts/kconfig.pl + \
            "configs/an7581.config" \
            configs/release.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Prebuild libffi (python3 _ctypes needs ffi.h in target sysroot)
        run: |
          make package/feeds/packages/libffi/compile -j"$(nproc)"

      - name: Build
        run: |
          make V=s -j"$(nproc)" 2>&1 | tee build.log | tail -200
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Pack
        run: |
          mkdir release
          tar --zstd -cf "release/ponwrt-an7581-usbwifi.tar.zst" \
            -C bin/targets/airoha an7581

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-usbwifi
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 14
